openapi: 3.0.3
info:
  title: 內部共享會議室預約系統 API
  version: 0.1.0-draft
  description: |
    功能分支：`002-meeting-room-booking`

    **狀態**：草稿

    ## API Schema 描述

    | 欄位 | 內容 |
    | --- | --- |
    | 共通 Header | JSON request 使用 `Content-Type: application/json`；登入後由瀏覽器自動帶入 HttpOnly session cookie；所有受保護 Endpoint 以該 session 辨識使用者 |
    | 時間格式 | 瞬間使用 ISO-8601 with offset（例如 `2026-07-31T14:00:00+08:00`）或 UTC `Z`；日期 query 使用 `YYYY-MM-DD`，所有「今日／平日／營業時段」以 `Asia/Taipei` 解讀 |

    ## 假設

    - 所有 `/api` Endpoint 除 `POST /api/auth/login` 外皆要求有效 session cookie；未登入固定回 `401 UNAUTHENTICATED`
    - 管理操作只允許 `facility_admin`；`employee` 與 `manager` 權限相同，越權固定回 `403 FORBIDDEN`
    - 時段採半開區間 `[starts_at, ends_at)`；相鄰但不重疊的預約或維護時段可成立
    - `POST /api/bookings` 的停用、容量、跨日、週末／假日、營業時段與時長違規使用 `400 BOOKING_RULE_VIOLATION`；設備需求欄位僅記錄；預約或維護時段重疊使用 409
    - 日曆與列表直接共用 `GET /api/bookings` 回應；第一版不另設 view 參數
    - `GET /api/bookings/mine` 第一版回傳全部歷史，不做分頁；預設依開始時間降冪排序
    - `GET /api/overview/today` 的 `busy_ratio` 以平日營業窗 09:00–21:00 共 720 分鐘計算；週末或假日的 `business_minutes` 與 `busy_ratio` 皆為 0
    - 維護時段查詢對所有已登入角色開放，讓預約畫面可先提示不可用；建立維護時段仍限設施管理員

tags:
  - name: Auth
    description: |
      Session/Auth 資料實體。

      **對應 User Story**
      - US1：使用帳號密碼登入，並依角色取得可執行操作
      - US4：以登入使用者角色限制設施管理操作

      Session 由 `connect-pg-simple` 管理；API 可見的登入使用者形狀不含密碼雜湊與 session token。
  - name: Rooms
    description: |
      Room 資料實體。

      **對應 User Story**
      - US1：瀏覽會議室屬性與啟用狀態
      - US2：依會議室呈現今日忙碌與預約
      - US4：設施管理員新增及停用會議室
  - name: Bookings
    description: |
      Booking 資料實體。

      **對應 User Story**
      - US1：建立符合規則且不衝突的單次預約
      - US2：以日曆與列表檢視同一批預約
      - US3：查看並取消自己的預約
      - US4：停用與維護時段限制新的預約

      查詢回應可加入 `room`、`booked_by` 與 `is_cancellable` 等顯示／衍生資料，持久化欄位名仍對齊 data-plan。
  - name: Overview
    description: |
      Overview 資料實體（Room 與當日 confirmed Booking 的查詢衍生投影，不另建資料表）。

      **對應 User Story**
      - US2：在首頁掌握今天各會議室的相對忙碌程度
  - name: Maintenance
    description: |
      MaintenanceWindow 資料實體。

      **對應 User Story**
      - US1：預約前辨識會議室不可用時段
      - US4：設施管理員設定與查閱維護黑名單時段

paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 帳號密碼登入
      description: |
        驗證帳密、建立伺服端 session，並以 `Set-Cookie` 回傳 HttpOnly session cookie。

        **對應 FR**：US1-FR1（支援帳號密碼登入並區分三種角色）

        **設計備註**：帳號或密碼錯誤統一回 `INVALID_CREDENTIALS`，避免揭露帳號是否存在；成功後輪替 session ID。

        **測試規劃**
        - 有效帳密登入成功 → 200
        - 缺少帳號或密碼 → 400
        - 帳號或密碼錯誤 → 401
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: training-password
      responses:
        '200':
          description: 登入成功，回傳使用者資料並設定 session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
              example:
                authenticated: true
                user:
                  id: '11111111-1111-4111-8111-111111111111'
                  username: alice
                  display_name: Alice
                  role: employee
                  created_at: '2026-07-30T01:00:00.000Z'
        '400':
          description: 缺少帳號或密碼
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: username and password are required
                  details: []
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid username or password
                  details: []

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: 登出
      description: |
        銷毀目前伺服端 session 並清除 cookie。

        **對應 FR**：US1-FR1（登入會話可結束並撤銷）

        **設計備註**：僅接受有效 session；成功回傳 JSON，不使用空 body。

        **測試規劃**
        - 已登入使用者登出成功 → 200
        - 未登入時要求登出 → 401
      operationId: logout
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                authenticated: false
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: 取得目前登入使用者
      description: |
        取得目前 session 對應的使用者資料。

        **對應 FR**：US1-FR1（辨識登入使用者與角色）

        **設計備註**：不回傳 `password_hash`、session ID 或 cookie 值。

        **測試規劃**
        - 有效 session 取得本人資料 → 200
        - session 不存在或已失效 → 401
      operationId: getCurrentUser
      responses:
        '200':
          description: 成功取得目前使用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUserResponse'
              example:
                authenticated: true
                user:
                  id: '11111111-1111-4111-8111-111111111111'
                  username: alice
                  display_name: Alice
                  role: employee
                  created_at: '2026-07-30T01:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/rooms:
    get:
      tags:
        - Rooms
      summary: 列出所有會議室
      description: |
        列出所有會議室，包含啟用與停用項目。

        **對應 FR**：US1-FR2（顯示會議室名稱、樓層、容量、設備及啟用狀態）

        **設計備註**：不預設排除停用會議室；前端以 `is_active` 明確呈現不可新約狀態；預設依 `floor`、`name` 排序。

        **測試規劃**
        - 清單同時含啟用與停用會議室 → 200
        - 尚無會議室時回空陣列 → 200
        - 未登入查詢 → 401
      operationId: listRooms
      responses:
        '200':
          description: 成功回傳會議室清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
              example:
                rooms:
                  - id: '22222222-2222-4222-8222-222222222222'
                    name: 大會議A
                    floor: 3F
                    capacity: 12
                    has_projector: true
                    has_video_conference: true
                    is_active: true
                    created_at: '2026-07-30T01:00:00.000Z'
                    updated_at: '2026-07-30T01:00:00.000Z'
                  - id: '66666666-6666-4666-8666-666666666666'
                    name: 小會議B
                    floor: 4F
                    capacity: 6
                    has_projector: false
                    has_video_conference: true
                    is_active: false
                    created_at: '2026-07-30T01:10:00.000Z'
                    updated_at: '2026-07-30T04:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      tags:
        - Rooms
      summary: 新增會議室
      description: |
        建立一間預設啟用的會議室。

        **對應 FR**
        - US4-FR1：設施管理員可新增會議室
        - US4-FR4：拒絕非設施管理員執行管理操作

        **設計備註**：僅 `facility_admin`；`name`、`floor` 不可空白，`capacity` 至少為 1；`has_projector` 與 `has_video_conference` 必填且須為布林值；建立時 `is_active` 固定為 `true`。

        **測試規劃**
        - 設施管理員建立會議室 → 201
        - 欄位缺漏或容量無效 → 400
        - 未登入建立 → 401
        - 員工或主管建立 → 403
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
            example:
              name: 研討室C
              floor: 5F
              capacity: 8
              has_projector: true
              has_video_conference: false
      responses:
        '201':
          description: 會議室建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              example:
                id: '77777777-7777-4777-8777-777777777777'
                name: 研討室C
                floor: 5F
                capacity: 8
                has_projector: true
                has_video_conference: false
                is_active: true
                created_at: '2026-07-30T05:00:00.000Z'
                updated_at: '2026-07-30T05:00:00.000Z'
        '400':
          description: 欄位缺漏或容量無效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: capacity must be at least 1
                  details:
                    - field: capacity
                      reason: must be at least 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FacilityAdminRequired'

  /api/rooms/{roomId}:
    patch:
      tags:
        - Rooms
      summary: 停用會議室
      description: |
        更新指定會議室的啟用狀態。

        **對應 FR**
        - US4-FR2：設施管理員可將會議室停用
        - US4-FR4：拒絕非設施管理員執行停用操作
        - GR-003：停用只禁止新預約，不取消既有已確認預約

        **設計備註**：僅 `facility_admin`；第一版 request 僅接受 `is_active: false`，不開放重新啟用；停用只擋新預約，不取消或改動既有預約。

        **測試規劃**
        - 設施管理員停用會議室 → 200
        - is_active 缺漏、格式錯誤或傳入 true → 400
        - 未登入更新 → 401
        - 員工或主管更新 → 403
        - roomId 不存在 → 404
      operationId: deactivateRoom
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateRoomRequest'
            example:
              is_active: false
      responses:
        '200':
          description: 會議室停用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
              example:
                id: '22222222-2222-4222-8222-222222222222'
                name: 大會議A
                floor: 3F
                capacity: 12
                has_projector: true
                has_video_conference: true
                is_active: false
                created_at: '2026-07-30T01:00:00.000Z'
                updated_at: '2026-07-30T05:30:00.000Z'
        '400':
          description: is_active 缺漏、格式錯誤或傳入 true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: is_active must be false
                  details:
                    - field: is_active
                      reason: only deactivation is supported
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FacilityAdminRequired'
        '404':
          $ref: '#/components/responses/RoomNotFound'

  /api/bookings:
    post:
      tags:
        - Bookings
      summary: 建立預約
      description: |
        在交易內校驗並建立單次已確認預約。

        **對應 FR**
        - US1-FR3：必填用途、人數、起迄與設備需求
        - US1-FR4：規則通過後建立 `confirmed` 紀錄
        - US1-FR5：拒絕預約或維護時段重疊
        - US1-FR6：拒絕人數超過容量
        - GR-001：同室已確認預約不得重疊
        - GR-002：台北同一平日 09:00–21:00、30 分鐘至 4 小時且非假日
        - GR-003：停用會議室只拒絕新預約，不改動既有預約

        **設計備註**：`user_id` 取自 session，不接受 client 指定；時段採半開區間 `[starts_at, ends_at)`；預約衝突回 `409 BOOKING_CONFLICT`；維護重疊回 `409 MAINTENANCE_CONFLICT`；停用、假日、營業時段、時長、跨日或容量超限回 400；設備需求僅記錄不因「會議室缺該設備」而拒絕；DB exclusion 為併發最終防線。

        **測試規劃**
        - 合法且無衝突時建立已確認預約 → 201
        - 欄位缺漏、格式錯誤或人數超過容量 → 400
        - 停用會議室、跨日、假日、非平日或違反營業時段與時長 → 400
        - 未登入建立 → 401
        - room_id 不存在 → 404
        - 與已確認預約重疊（含併發競爭） → 409
        - 與維護時段重疊 → 409
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example:
              room_id: '22222222-2222-4222-8222-222222222222'
              purpose: 產品週會
              attendee_count: 6
              needs_projector: true
              needs_video_conference: false
              starts_at: '2026-07-31T14:00:00+08:00'
              ends_at: '2026-07-31T15:00:00+08:00'
      responses:
        '201':
          description: 預約建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: '33333333-3333-4333-8333-333333333333'
                room_id: '22222222-2222-4222-8222-222222222222'
                user_id: '11111111-1111-4111-8111-111111111111'
                purpose: 產品週會
                attendee_count: 6
                needs_projector: true
                needs_video_conference: false
                starts_at: '2026-07-31T14:00:00+08:00'
                ends_at: '2026-07-31T15:00:00+08:00'
                status: confirmed
                created_at: '2026-07-30T02:00:00.000Z'
                updated_at: '2026-07-30T02:00:00.000Z'
        '400':
          description: 欄位缺漏、格式錯誤、人數超過容量，或違反預約規則（停用、假日、營業時段、時長、跨日等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BOOKING_RULE_VIOLATION
                  message: Booking must be within 09:00–21:00 on one business day in Asia/Taipei
                  details:
                    - rule: GR-002
                      reason: outside_business_hours
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/RoomNotFound'
        '409':
          description: 與已確認預約或維護時段重疊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookingConflict:
                  summary: 與已確認預約重疊
                  value:
                    error:
                      code: BOOKING_CONFLICT
                      message: The room already has a confirmed booking in this time range
                      details:
                        - room_id: '22222222-2222-4222-8222-222222222222'
                          starts_at: '2026-07-31T14:00:00+08:00'
                          ends_at: '2026-07-31T15:00:00+08:00'
                maintenanceConflict:
                  summary: 與維護時段重疊
                  value:
                    error:
                      code: MAINTENANCE_CONFLICT
                      message: The room is unavailable during a maintenance window
                      details:
                        - room_id: '22222222-2222-4222-8222-222222222222'
                          starts_at: '2026-07-31T14:00:00+08:00'
                          ends_at: '2026-07-31T15:00:00+08:00'

    get:
      tags:
        - Bookings
      summary: 依日期查詢已確認預約
      description: |
        依台北日曆日取得已確認預約，供日曆與列表共用。

        **對應 FR**
        - US2-FR2：提供日曆視圖資料
        - US2-FR3：提供列表視圖資料
        - US2-FR4：呈現已確認預約的會議室、時段及辨識摘要

        **設計備註**：`date` 必填並以 `Asia/Taipei` 日界查詢；`roomId` 可選；只回 `confirmed`，依 `starts_at`、會議室名稱排序；兩種視圖不得各自呼叫不同資料源。

        **測試規劃**
        - 查詢台北日全部已確認預約 → 200
        - 依 roomId 篩選 → 200
        - 該日無預約時回空陣列 → 200
        - date 缺漏或格式錯誤 → 400
        - 未登入查詢 → 401
        - roomId 不存在 → 404
      operationId: listBookingsByDate
      parameters:
        - name: date
          in: query
          required: true
          description: 台北日曆日，格式 `YYYY-MM-DD`
          schema:
            type: string
            format: date
            example: '2026-07-31'
        - name: roomId
          in: query
          required: false
          description: 可選的會議室 UUID 篩選
          schema:
            $ref: '#/components/schemas/Uuid'
          example: '22222222-2222-4222-8222-222222222222'
      responses:
        '200':
          description: 成功回傳指定日期的已確認預約
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingsByDateResponse'
              example:
                date: '2026-07-31'
                timezone: Asia/Taipei
                bookings:
                  - id: '33333333-3333-4333-8333-333333333333'
                    room_id: '22222222-2222-4222-8222-222222222222'
                    room:
                      name: 大會議A
                      floor: 3F
                    user_id: '11111111-1111-4111-8111-111111111111'
                    booked_by:
                      display_name: Alice
                    purpose: 產品週會
                    attendee_count: 6
                    needs_projector: true
                    needs_video_conference: false
                    starts_at: '2026-07-31T14:00:00+08:00'
                    ends_at: '2026-07-31T15:00:00+08:00'
                    status: confirmed
                    created_at: '2026-07-30T02:00:00.000Z'
                    updated_at: '2026-07-30T02:00:00.000Z'
        '400':
          description: date 缺漏或格式錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: date must use YYYY-MM-DD
                  details:
                    - field: date
                      reason: invalid_date
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/RoomNotFound'

  /api/bookings/mine:
    get:
      tags:
        - Bookings
      summary: 取得本人的預約歷史
      description: |
        取得目前登入使用者的預約歷史。

        **對應 FR**：US3-FR1（列出目前使用者自己的已確認與已取消預約）

        **設計備註**：不接受 `userId`；依 `starts_at` 降冪排序；`is_cancellable` 由狀態與目前時間衍生。

        **測試規劃**
        - 回傳本人的已確認與已取消預約 → 200
        - 本人無預約時回空陣列 → 200
        - 未登入查詢 → 401
      operationId: listMyBookings
      responses:
        '200':
          description: 成功回傳本人預約清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBookingsResponse'
              example:
                bookings:
                  - id: '33333333-3333-4333-8333-333333333333'
                    room_id: '22222222-2222-4222-8222-222222222222'
                    room:
                      name: 大會議A
                      floor: 3F
                    user_id: '11111111-1111-4111-8111-111111111111'
                    purpose: 產品週會
                    attendee_count: 6
                    needs_projector: true
                    needs_video_conference: false
                    starts_at: '2026-07-31T14:00:00+08:00'
                    ends_at: '2026-07-31T15:00:00+08:00'
                    status: confirmed
                    is_cancellable: true
                    created_at: '2026-07-30T02:00:00.000Z'
                    updated_at: '2026-07-30T02:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/bookings/{bookingId}/cancel:
    post:
      tags:
        - Bookings
      summary: 取消預約
      description: |
        取消目前登入使用者擁有且尚可取消的預約。

        **對應 FR**
        - US3-FR2：可取消自己的未結束已確認預約
        - US3-FR3：取消後改為 `cancelled` 並釋放時段
        - US3-FR4：不得取消他人的預約

        **設計備註**：所有權不符回 403；已取消或已結束回 409；成功以交易更新狀態與 `updated_at`，保留歷史資料。

        **測試規劃**
        - 取消自己的未結束已確認預約 → 200
        - 未登入取消 → 401
        - 取消他人的預約 → 403
        - bookingId 不存在 → 404
        - 重複取消或取消已結束預約 → 409
      operationId: cancelBooking
      parameters:
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '200':
          description: 預約取消成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: '33333333-3333-4333-8333-333333333333'
                room_id: '22222222-2222-4222-8222-222222222222'
                user_id: '11111111-1111-4111-8111-111111111111'
                purpose: 產品週會
                attendee_count: 6
                needs_projector: true
                needs_video_conference: false
                starts_at: '2026-07-31T14:00:00+08:00'
                ends_at: '2026-07-31T15:00:00+08:00'
                status: cancelled
                created_at: '2026-07-30T02:00:00.000Z'
                updated_at: '2026-07-30T06:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 不得取消他人的預約
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: You cannot cancel another user's booking
                  details: []
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          description: 預約已取消或已結束，無法再次取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BOOKING_NOT_CANCELLABLE
                  message: Booking is already cancelled or has ended
                  details: []

  /api/overview/today:
    get:
      tags:
        - Overview
      summary: 取得今日各會議室忙碌概況
      description: |
        回傳今日每間會議室的預約筆數與忙碌比例。

        **對應 FR**：US2-FR1（呈現 Asia/Taipei 今日各會議室的忙碌概況）

        **設計備註**：「今日」由伺服器依 `Asia/Taipei` 計算；只計 confirmed 預約；無預約仍回傳房間且數值為 0；週末／假日不以除以零計算。

        **測試規劃**
        - 今日含忙碌與空閒會議室 → 200
        - 今日無任何已確認預約 → 200
        - 今日為週末或假日 → 200
        - 未登入查詢 → 401
      operationId: getTodayOverview
      responses:
        '200':
          description: 成功回傳今日概況
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
              example:
                date: '2026-07-30'
                timezone: Asia/Taipei
                rooms:
                  - room_id: '22222222-2222-4222-8222-222222222222'
                    room_name: 大會議A
                    is_active: true
                    booked_minutes: 180
                    business_minutes: 720
                    busy_ratio: 0.25
                    confirmed_booking_count: 3
                  - room_id: '66666666-6666-4666-8666-666666666666'
                    room_name: 小會議B
                    is_active: false
                    booked_minutes: 0
                    business_minutes: 720
                    busy_ratio: 0
                    confirmed_booking_count: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/rooms/{roomId}/maintenance-windows:
    post:
      tags:
        - Maintenance
      summary: 新增維護時段
      description: |
        為指定會議室新增不可建立預約的維護區間。

        **對應 FR**
        - US4-FR3：設施管理員可設定會議室維護黑名單時段
        - US4-FR4：拒絕非設施管理員設定維護時段

        **設計備註**：僅 `facility_admin`；`created_by` 取自 session；`ends_at` 必須晚於 `starts_at`；維護區間採半開區間 `[starts_at, ends_at)`；不自動取消既有 confirmed 預約。

        **測試規劃**
        - 設施管理員新增有效維護時段 → 201
        - 時間格式錯誤或結束不晚於開始 → 400
        - 未登入新增 → 401
        - 員工或主管新增 → 403
        - roomId 不存在 → 404
      operationId: createMaintenanceWindow
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceWindowRequest'
            example:
              starts_at: '2026-08-01T09:00:00+08:00'
              ends_at: '2026-08-01T12:00:00+08:00'
              note: 空調維修
      responses:
        '201':
          description: 維護時段建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
              example:
                id: '44444444-4444-4444-8444-444444444444'
                room_id: '22222222-2222-4222-8222-222222222222'
                starts_at: '2026-08-01T09:00:00+08:00'
                ends_at: '2026-08-01T12:00:00+08:00'
                note: 空調維修
                created_by: '55555555-5555-4555-8555-555555555555'
                created_at: '2026-07-30T03:00:00.000Z'
        '400':
          description: 時間格式錯誤或結束不晚於開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: ends_at must be later than starts_at
                  details:
                    - field: ends_at
                      reason: must_be_after_starts_at
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/FacilityAdminRequired'
        '404':
          $ref: '#/components/responses/RoomNotFound'

    get:
      tags:
        - Maintenance
      summary: 查詢維護時段
      description: |
        查詢指定會議室在時間區間內相交的維護時段。

        **對應 FR**
        - US1-FR5：支援預約前辨識維護不可用時段
        - US4-FR3：支援管理員查閱指定會議室維護時段

        **設計備註**：已登入三角色皆可查詢，支援預約 UI 預檢與管理畫面；`from`、`to` 皆必填且 `to` 晚於 `from`；結果依 `starts_at` 排序。

        **測試規劃**
        - 查詢區間內有維護時段 → 200
        - 查詢區間內無維護時段時回空陣列 → 200
        - from／to 缺漏、格式錯誤或順序無效 → 400
        - 未登入查詢 → 401
        - roomId 不存在 → 404
      operationId: listMaintenanceWindows
      parameters:
        - $ref: '#/components/parameters/RoomIdPath'
        - name: from
          in: query
          required: true
          description: 查詢區間起始瞬間（ISO-8601 with offset 或 UTC Z）
          schema:
            type: string
            format: date-time
          example: '2026-08-01T00:00:00+08:00'
        - name: to
          in: query
          required: true
          description: 查詢區間結束瞬間，必須晚於 `from`
          schema:
            type: string
            format: date-time
          example: '2026-08-02T00:00:00+08:00'
      responses:
        '200':
          description: 成功回傳維護時段清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindowListResponse'
              example:
                room_id: '22222222-2222-4222-8222-222222222222'
                maintenance_windows:
                  - id: '44444444-4444-4444-8444-444444444444'
                    room_id: '22222222-2222-4222-8222-222222222222'
                    starts_at: '2026-08-01T09:00:00+08:00'
                    ends_at: '2026-08-01T12:00:00+08:00'
                    note: 空調維修
                    created_by: '55555555-5555-4555-8555-555555555555'
                    created_at: '2026-07-30T03:00:00.000Z'
        '400':
          description: from／to 缺漏、格式錯誤或順序無效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: from and to must be valid ISO-8601 datetimes and to must be later than from
                  details: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/RoomNotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: |
        HttpOnly session cookie，由 `connect-pg-simple` 管理。
        登入成功後瀏覽器自動帶入；所有受保護 Endpoint 以該 session 辨識使用者。
        僅 `POST /api/auth/login` 為公開端點，不需此 cookie。

  security:
    - sessionCookie: []

  parameters:
    RoomIdPath:
      name: roomId
      in: path
      required: true
      description: 會議室 UUID
      schema:
        $ref: '#/components/schemas/Uuid'
      example: '22222222-2222-4222-8222-222222222222'

    BookingIdPath:
      name: bookingId
      in: path
      required: true
      description: 預約 UUID
      schema:
        $ref: '#/components/schemas/Uuid'
      example: '33333333-3333-4333-8333-333333333333'

  responses:
    Unauthenticated:
      description: 未登入或 session 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHENTICATED
              message: Authentication is required
              details: []

    FacilityAdminRequired:
      description: 需要設施管理員角色
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Facility administrator role is required
              details: []

    RoomNotFound:
      description: 會議室不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ROOM_NOT_FOUND
              message: Room was not found
              details: []

    BookingNotFound:
      description: 預約不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BOOKING_NOT_FOUND
              message: Booking was not found
              details: []

  schemas:
    Uuid:
      type: string
      format: uuid
      description: 對外資源 ID（UUID 字串）

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      description: |
        全檔共用的錯誤回應格式。
        各 Endpoint 仍逐一列出可能的 error status 與完整錯誤範例。
        `details` 可用於提供欄位或規則細節。

    ErrorBody:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: 機器可讀的錯誤代碼
          enum:
            - VALIDATION_ERROR
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - ROOM_NOT_FOUND
            - BOOKING_NOT_FOUND
            - BOOKING_RULE_VIOLATION
            - BOOKING_CONFLICT
            - MAINTENANCE_CONFLICT
            - BOOKING_NOT_CANCELLABLE
        message:
          type: string
          description: 人類可讀的錯誤訊息
        details:
          type: array
          description: 欄位、規則或衝突細節
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      description: |
        錯誤細節項目，依情境包含不同欄位：
        - 驗證錯誤：`field` + `reason`
        - 預約規則違反：`rule` + `reason`
        - 時段衝突：`room_id` + `starts_at` + `ends_at`
      oneOf:
        - $ref: '#/components/schemas/FieldErrorDetail'
        - $ref: '#/components/schemas/RuleErrorDetail'
        - $ref: '#/components/schemas/ConflictErrorDetail'

    FieldErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: 驗證失敗的欄位名稱
        reason:
          type: string
          description: 驗證失敗原因
      required:
        - field
        - reason
      additionalProperties: false

    RuleErrorDetail:
      type: object
      properties:
        rule:
          type: string
          description: 違反的規則代碼（例如 GR-002）
        reason:
          type: string
          description: 規則違反原因
      required:
        - rule
        - reason
      additionalProperties: false

    ConflictErrorDetail:
      type: object
      properties:
        room_id:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          type: string
          format: date-time
          description: 衝突時段開始瞬間
        ends_at:
          type: string
          format: date-time
          description: 衝突時段結束瞬間
      required:
        - room_id
        - starts_at
        - ends_at
      additionalProperties: false

    UserRole:
      type: string
      enum:
        - employee
        - manager
        - facility_admin
      description: 使用者角色

    User:
      type: object
      required:
        - id
        - username
        - display_name
        - role
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: 登入使用者 UUID
        username:
          type: string
          description: 登入帳號
        display_name:
          type: string
          description: UI 顯示名稱
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time
          description: 帳號建立時間

    AuthenticatedUserResponse:
      type: object
      required:
        - authenticated
        - user
      properties:
        authenticated:
          type: boolean
          description: 目前 request 是否具有效 session
        user:
          $ref: '#/components/schemas/User'

    LogoutResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
          enum:
            - false
          description: 登出後為 false

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: 登入帳號
        password:
          type: string
          format: password
          description: 登入密碼

    Room:
      type: object
      required:
        - id
        - name
        - floor
        - capacity
        - has_projector
        - has_video_conference
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: 會議室 UUID
        name:
          type: string
          description: 會議室名稱
        floor:
          type: string
          description: 樓層標示
        capacity:
          type: integer
          minimum: 1
          description: 最大容納人數
        has_projector:
          type: boolean
          description: 是否具備投影機
        has_video_conference:
          type: boolean
          description: 是否具備視訊設備
        is_active:
          type: boolean
          description: 是否接受新預約；停用會議室仍保留並可辨識
        created_at:
          type: string
          format: date-time
          description: 建立時間
        updated_at:
          type: string
          format: date-time
          description: 最後更新時間

    RoomListResponse:
      type: object
      required:
        - rooms
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'

    CreateRoomRequest:
      type: object
      required:
        - name
        - floor
        - capacity
        - has_projector
        - has_video_conference
      properties:
        name:
          type: string
          minLength: 1
          description: 會議室名稱，不可空白
        floor:
          type: string
          minLength: 1
          description: 樓層標示，不可空白
        capacity:
          type: integer
          minimum: 1
          description: 最大容納人數，至少為 1
        has_projector:
          type: boolean
          description: 是否具備投影機（必填）
        has_video_conference:
          type: boolean
          description: 是否具備視訊設備（必填）

    DeactivateRoomRequest:
      type: object
      required:
        - is_active
      properties:
        is_active:
          type: boolean
          enum:
            - false
          description: 第一版僅接受 `false`（停用），不開放重新啟用

    BookingStatus:
      type: string
      enum:
        - confirmed
        - cancelled
      description: 預約狀態

    Booking:
      type: object
      required:
        - id
        - room_id
        - user_id
        - purpose
        - attendee_count
        - needs_projector
        - needs_video_conference
        - starts_at
        - ends_at
        - status
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: 預約 UUID
        room_id:
          $ref: '#/components/schemas/Uuid'
          description: 被預約的會議室 UUID
        user_id:
          $ref: '#/components/schemas/Uuid'
          description: 預約者 UUID，由 session 決定
        purpose:
          type: string
          description: 會議用途
        attendee_count:
          type: integer
          minimum: 1
          description: 預期人數
        needs_projector:
          type: boolean
          description: 是否需要投影機
        needs_video_conference:
          type: boolean
          description: 是否需要視訊設備
        starts_at:
          type: string
          format: date-time
          description: 預約開始瞬間
        ends_at:
          type: string
          format: date-time
          description: 預約結束瞬間
        status:
          $ref: '#/components/schemas/BookingStatus'
        created_at:
          type: string
          format: date-time
          description: 建立時間
        updated_at:
          type: string
          format: date-time
          description: 最後更新時間

    CreateBookingRequest:
      type: object
      required:
        - room_id
        - purpose
        - attendee_count
        - needs_projector
        - needs_video_conference
        - starts_at
        - ends_at
      properties:
        room_id:
          $ref: '#/components/schemas/Uuid'
          description: 被預約的會議室 UUID
        purpose:
          type: string
          description: 會議用途
        attendee_count:
          type: integer
          minimum: 1
          description: 預期人數
        needs_projector:
          type: boolean
          description: 是否需要投影機（僅記錄，不因會議室缺設備而拒絕）
        needs_video_conference:
          type: boolean
          description: 是否需要視訊設備（僅記錄，不因會議室缺設備而拒絕）
        starts_at:
          type: string
          format: date-time
          description: 預約開始瞬間
        ends_at:
          type: string
          format: date-time
          description: 預約結束瞬間

    RoomSummary:
      type: object
      required:
        - name
        - floor
      properties:
        name:
          type: string
          description: 會議室名稱
        floor:
          type: string
          description: 樓層標示

    BookedBySummary:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string
          description: 預約者顯示名稱

    BookingWithRoomSummary:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required:
            - room
            - booked_by
          properties:
            room:
              $ref: '#/components/schemas/RoomSummary'
            booked_by:
              $ref: '#/components/schemas/BookedBySummary'

    BookingsByDateResponse:
      type: object
      required:
        - date
        - timezone
        - bookings
      properties:
        date:
          type: string
          format: date
          description: 查詢的台北日曆日
        timezone:
          type: string
          example: Asia/Taipei
          description: 業務日曆時區
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/BookingWithRoomSummary'

    MyBooking:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required:
            - room
            - is_cancellable
          properties:
            room:
              $ref: '#/components/schemas/RoomSummary'
            is_cancellable:
              type: boolean
              description: 查詢衍生的可取消狀態，不落庫

    MyBookingsResponse:
      type: object
      required:
        - bookings
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/MyBooking'

    OverviewRoomSummary:
      type: object
      required:
        - room_id
        - room_name
        - is_active
        - booked_minutes
        - business_minutes
        - busy_ratio
        - confirmed_booking_count
      properties:
        room_id:
          $ref: '#/components/schemas/Uuid'
          description: 會議室 UUID
        room_name:
          type: string
          description: 會議室名稱
        is_active:
          type: boolean
          description: 是否接受新預約
        booked_minutes:
          type: integer
          minimum: 0
          description: 今日營業時段內已確認預約占用分鐘數
        business_minutes:
          type: integer
          minimum: 0
          description: 今日可計算的營業分鐘數；平日為 720，週末或假日為 0
        busy_ratio:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: business_minutes 大於 0 時的占用比例；否則為 0
        confirmed_booking_count:
          type: integer
          minimum: 0
          description: 今日已確認預約筆數

    OverviewResponse:
      type: object
      required:
        - date
        - timezone
        - rooms
      properties:
        date:
          type: string
          format: date
          description: Asia/Taipei 的今日日期
        timezone:
          type: string
          example: Asia/Taipei
          description: 業務日曆時區
        rooms:
          type: array
          description: 每間會議室的今日摘要，包含停用會議室
          items:
            $ref: '#/components/schemas/OverviewRoomSummary'

    MaintenanceWindow:
      type: object
      required:
        - id
        - room_id
        - starts_at
        - ends_at
        - created_by
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: 維護時段 UUID
        room_id:
          $ref: '#/components/schemas/Uuid'
          description: 所屬會議室 UUID
        starts_at:
          type: string
          format: date-time
          description: 維護開始瞬間
        ends_at:
          type: string
          format: date-time
          description: 維護結束瞬間
        note:
          type: string
          description: 可選的維護說明
        created_by:
          $ref: '#/components/schemas/Uuid'
          description: 建立此維護時段的設施管理員 UUID
        created_at:
          type: string
          format: date-time
          description: 建立時間

    CreateMaintenanceWindowRequest:
      type: object
      required:
        - starts_at
        - ends_at
      properties:
        starts_at:
          type: string
          format: date-time
          description: 維護開始瞬間
        ends_at:
          type: string
          format: date-time
          description: 維護結束瞬間，必須晚於 starts_at
        note:
          type: string
          description: 可選的維護說明

    MaintenanceWindowListResponse:
      type: object
      required:
        - room_id
        - maintenance_windows
      properties:
        room_id:
          $ref: '#/components/schemas/Uuid'
        maintenance_windows:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceWindow'
