services:
  postgres:
    image: postgres:16-alpine
    container_name: jochu-meeting-room-postgres
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
      POSTGRES_DB: meeting_room
    ports:
      - "5432:5432"
    volumes:
      - jochu_meeting_room_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_room"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jochu_meeting_room_pgdata:
